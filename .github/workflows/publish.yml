name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm install
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Validate version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: package.json=$PKG_VERSION tag=$TAG_VERSION"
            exit 1
          fi

  publish:
    needs: validate
    runs-on: ubuntu-latest
    # Publishing goes through npm trusted publishing (OIDC), so there is no
    # token: npm mints short-lived credentials from this job's identity, which
    # also sidesteps the account 2FA requirement that blocks CI tokens.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      # No registry-url here on purpose: it writes an .npmrc containing
      # _authToken=${NODE_AUTH_TOKEN}, and with no token set npm sends an empty
      # credential and never falls back to OIDC (the registry masks that as a
      # 404). Trusted publishing needs no .npmrc at all.
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      # Node 22 ships npm 10; OIDC publishing needs 11.5.1 or newer.
      - run: npm install -g npm@latest
      - run: npm --version
      - name: OIDC availability
        run: |
          echo "id-token request URL present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}${ACTIONS_ID_TOKEN_REQUEST_URL:-NO}"
          echo "id-token request token present: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-NO}"
      - run: npm install
      - run: npm run build
      - run: npm publish
